[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmcli"
version = "0.4.0"
description = "A clean, streaming CLI for local and public LLM providers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.27.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
llmcli = "llmcli.cli:main"

[tool.setuptools.packages.find]
include = ["llmcli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a real local server; run with pytest -m live --live-profile NAME",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
